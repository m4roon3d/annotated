<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    body { width: 300px; margin: 0; padding: 16px; font: 14px/1.45 system-ui, sans-serif; background: #F2F4F3; color: #1B2430; }
    h1 { font-size: 16px; margin: 0 0 4px; }
    p { font-size: 13px; color: #5E6B78; margin: 0 0 12px; }
    button { width: 100%; padding: 9px; border: 1px solid #D9DFE3; border-radius: 6px; background: #fff; color: #1B2430; font-weight: 600; font-size: 14px; cursor: pointer; margin-top: 6px; }
    button.primary { background: #1B2430; color: #fff; border-color: #1B2430; box-shadow: inset 0 -3px 0 #FFE45C; }
    button[disabled] { opacity: .45; cursor: default; }
    h2 { font-size: 13px; margin: 16px 0 6px; color: #5E6B78; font-weight: 600; }
    ul { margin: 0; padding: 0 0 0 16px; font-size: 13px; max-height: 160px; overflow-y: auto; }
    li { margin: 3px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .link { background: none; border: 0; color: #5E6B78; font-weight: 400; font-size: 12px; text-decoration: underline; padding: 4px; }
    #msg { font-size: 12px; color: #5E6B78; margin-top: 8px; min-height: 16px; }
  </style>
</head>
<body>
  <h1>annotated</h1>
  <p id="here">Open a YouTube video or Short to study or save it.</p>
  <button id="btn-study" class="primary" type="button" disabled>Study this video</button>
  <button id="btn-save" type="button" disabled>Save for later</button>
  <h2 id="saved-title">Saved (0)</h2>
  <ul id="saved"></ul>
  <button id="btn-run" class="primary" type="button" disabled>Analyze saved videos</button>
  <button id="btn-clear" class="link" type="button" hidden>Clear saved list</button>
  <div id="msg"></div>
  <script src="popup.js"></script>
</body>
</html>
